apiVersion: v1
kind: ConfigMap
metadata:
  name: reach-config
data:
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
  REACH_WORKERS_0_ID: worker-0
  REACH_WORKERS_0_URL: http://llama-worker-0.llama-workers:8080
  REACH_WORKERS_1_ID: worker-1
  REACH_WORKERS_1_URL: http://llama-worker-1.llama-workers:8080
  REACH_WORKERS_2_ID: worker-2
  REACH_WORKERS_2_URL: http://llama-worker-2.llama-workers:8080
  REACH_MAX_IN_FLIGHT_PER_WORKER: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: reach
spec:
  type: NodePort
  selector:
    app: reach-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reach-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reach-orchestrator
  template:
    metadata:
      labels:
        app: reach-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: orchestrator
          image: reach-orchestrator:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: reach-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
