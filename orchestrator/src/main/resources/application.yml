server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: reach-orchestrator
  threads:
    virtual:
      enabled: true   # blocking calls to workers park a virtual thread, not a platform thread
  mvc:
    async:
      request-timeout: 10m   # long generations are streamed through MVC async

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

reach:
  health-interval: 2s
  health-timeout: 1s
  connect-timeout: 2s
  request-timeout: 120s
  max-attempts: 3
  max-in-flight-per-worker: 4
  breaker:
    failure-rate-threshold: 50
    sliding-window-size: 6
    minimum-calls: 4
    open-duration: 15s
    half-open-calls: 2
  # Override with REACH_WORKERS_0_ID / REACH_WORKERS_0_URL ... or a mounted config file.
  workers:
    - id: worker-1
      url: http://localhost:8081
    - id: worker-2
      url: http://localhost:8082
    - id: worker-3
      url: http://localhost:8083
