name: Record demo

# Re-records demo/reach-failover.gif against three real llama.cpp workers.
# The GIF is pushed to the demo-recording branch to be reviewed and copied into main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [demo/demo.tape, scripts/demo.sh]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start the model workers and orchestrator
        run: docker compose up -d --build
      - name: Wait for all three workers
        run: |
          for i in $(seq 1 120); do
            [ "$(curl -s localhost:8080/v1/workers | jq '[.[] | select(.healthy)] | length')" = "3" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Warm up each worker
        run: |
          for i in 1 2 3 4 5 6; do
            curl -s -o /dev/null localhost:8080/v1/chat/completions -H 'content-type: application/json' \
              -d '{"max_tokens":4,"messages":[{"role":"user","content":"hi"}]}'
          done
      - name: Dry run of the demo script
        run: |
          set -o pipefail
          scripts/demo.sh 2>&1 | tee dry-run.txt || status=$?
          # One annotation holding the whole output (GitHub keeps only 10 per step).
          echo "::notice title=dry run::$(grep -v '^$' dry-run.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit ${status:-0}
      - name: Clear the counters left by the dry run
        run: |
          for w in worker-1 worker-2 worker-3; do curl -s -o /dev/null -X POST localhost:8080/v1/workers/$w/reset; done
          curl -s localhost:8080/v1/workers | jq -c '.[] | [.id, .healthy, .served]'
      - name: Install VHS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg ttyd fonts-jetbrains-mono
          curl -sSL -o vhs.deb https://github.com/charmbracelet/vhs/releases/download/v0.10.0/vhs_0.10.0_amd64.deb
          sudo dpkg -i vhs.deb
      - name: Record
        run: |
          set -o pipefail
          vhs demo/demo.tape 2>&1 | tee vhs.log || {
            echo "::error title=vhs::$(tail -20 vhs.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Publish to the demo-recording branch
        run: |
          ls -la demo/reach-failover.gif
          mkdir /tmp/out && cp demo/reach-failover.gif /tmp/out/
          cd /tmp/out
          git init -q -b demo-recording
          git add reach-failover.gif
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Demo recording from ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" demo-recording
      - name: Logs
        if: failure()
        run: docker compose logs --tail 40
