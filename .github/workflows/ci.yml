name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test the orchestrator
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log || {
            grep -E "\[ERROR\]" build.log | grep -v -E "^\[ERROR\] *$|Re-run Maven|For more information|Help 1|-> \[Help" \
              | head -20 | while IFS= read -r l; do echo "::error title=maven::$l"; done
            exit 1
          }
      - name: Test report
        if: always()
        run: |
          if ls target/surefire-reports/*.txt > /dev/null 2>&1; then
            cat target/surefire-reports/*.txt | grep -E "Tests run|FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: End-to-end with real llama.cpp workers
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the model workers and orchestrator
        run: docker compose up -d --build
      - name: Wait for all three workers to load the model
        run: |
          for i in $(seq 1 120); do
            healthy=$(curl -s localhost:8080/v1/workers | grep -o '"healthy":true' | wc -l || true)
            echo "healthy workers: $healthy"
            [ "$healthy" = "3" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Routing, failover and streaming against real models
        run: scripts/ci_e2e.sh
      - name: Logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 60
          docker compose logs --no-color --tail 6 orchestrator | while IFS= read -r l; do echo "::warning title=orchestrator::$l"; done

  k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate
        run: kubectl kustomize deploy/k8s | kubeconform -strict -summary -
